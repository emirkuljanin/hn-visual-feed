# The same checks as the verify-build skill, on every pull request and every push to master. Third-party actions
# are pinned to commit SHAs (the comment names the release; Dependabot keeps them current) so a moved tag cannot
# change CI. Runners are pinned to ubuntu-24.04 rather than ubuntu-latest so an image migration cannot change the
# emulator or screenshot rendering under us.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to a PR supersedes its old run. Pushes to master are grouped by commit, so every commit that lands
# keeps its own result (a shared group would drop all but the newest pending run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, tests, screenshots, builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Gradle daemon runs on JDK 25 (gradle/gradle-daemon-jvm.properties); providing it avoids a download.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      # The open-source cache implementation, not the default closed-source one.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # No Cloudflare credentials here on purpose: they would be compiled into the published APK. CI builds use
      # on-device art only. --continue reports every failing module in one run instead of the first. Lint fails
      # on warnings too (build-logic), so "no issues" is enforced by the build itself.
      - name: Check
        run: >-
          ./gradlew
          --continue
          -PwarningsAsErrors=true
          spotlessCheck
          lintDebug
          testDebugUnitTest
          verifyRoborazziDebug
          assembleDebug
          assembleRelease

      - name: Upload the release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hn-visual-feed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          # Test and lint reports, and Roborazzi's comparison images when a screenshot differs.
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Hardware acceleration for the x86_64 emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Database migrations and the real MediaPipe text embedder, which Robolectric cannot load. The live
      # Cloudflare test skips itself without its opt-in argument and credentials.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew -PwarningsAsErrors=true connectedDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
