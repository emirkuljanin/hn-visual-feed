# Pushing a tag like v1.0.0 publishes a GitHub Release with the release APK (R8-minified, debug-signed so anyone
# can install it) and its R8 mapping file. Built without Cloudflare credentials, like CI: a public APK must not
# carry an API token. A tag with a suffix (v1.1.0-rc1) becomes a pre-release.
#
# Two jobs so the Gradle build, which runs third-party plugins and dependencies, never holds a token that can
# write to the repository: `build` is read-only, `publish` only downloads the APK and calls the GitHub API.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to check the tag is on master
          persist-credentials: false

      # Guards against tagging an unmerged commit. (Not a security control: the workflow file comes from the tagged
      # commit; restricting who may push v* tags would need a tag ruleset.)
      - name: Require the tag to be on master
        run: |
          git merge-base --is-ancestor HEAD origin/master ||
            { echo "::error::$GITHUB_REF_NAME is not on master; release only merged commits"; exit 1; }

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      # No cache for releases: the published APK is built from source and fresh downloads only.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      # The app reports the tag as its version (v1.2.0 -> 1.2.0); the run number keeps versionCode increasing.
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: >-
          ./gradlew -PwarningsAsErrors=true
          -PversionName="${TAG#v}" -PversionCode="$GITHUB_RUN_NUMBER"
          assembleRelease

      - name: Collect the release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/hn-visual-feed-$TAG.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/hn-visual-feed-$TAG-mapping.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # Re-running a failed publish replaces the files instead of failing because the release exists.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
            notes="This APK shows on-device art only: cloud thumbnails need your own free Cloudflare token (see the README)."
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes "$notes" --generate-notes "${prerelease[@]}"
          fi
